{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "claude-mem.fullname" . }}-server
  labels:
    {{- include "claude-mem.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      {{- include "claude-mem.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "claude-mem.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if or $np.allowedNamespaceLabels $np.allowedPodLabels }}
        - {{- with $np.allowedNamespaceLabels }}
          namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
          {{- with $np.allowedPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- end }}
        {{- with $np.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- include "claude-mem.metricsIngressRule" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "claude-mem.fullname" . }}-worker
  labels:
    {{- include "claude-mem.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "claude-mem.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress]
  {{- if .Values.metrics.enabled }}
  ingress:
    {{- include "claude-mem.metricsIngressRule" . | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
{{- if .Values.valkey.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "claude-mem.valkeyFullname" . }}
  labels:
    {{- include "claude-mem.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  podSelector:
    matchLabels:
      {{- include "claude-mem.selectorLabels" (dict "root" . "component" "valkey") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 6379
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "claude-mem.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
